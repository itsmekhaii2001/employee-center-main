<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--text:#344054;--muted:#7b8798;--border:#e1e7ef;--yellow:#fff6cc;--yb:#f3d96b;--yt:#9a7200;--purple:#eee8ff;--pb:#d2c3fa;--pt:#7058b5;--red:#ffe6e8;--rb:#ffbdc3;--rt:#cc5360;--gray:#eef1f5;--gb:#d8dee7;--gt:#667085}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f7fafe,#f2f6fb);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Arial,sans-serif} button,input{font:inherit} button{cursor:pointer}
    .app{width:min(1500px,calc(100% - 24px));margin:18px auto 40px}.header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:27px;background:linear-gradient(135deg,#7ddbd0,#8ca5f6)}.title{font-size:22px;font-weight:900}.sub{color:var(--muted);font-size:12px}.pill{padding:8px 13px;border-radius:99px;background:#e7f9eb;color:#3b9660;font-size:11px;font-weight:850}.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.home-btn{min-height:36px;padding:0 13px;border:1px solid var(--border);border-radius:11px;background:#fff;color:#667085;font-size:11px;font-weight:850;box-shadow:0 5px 16px rgba(59,78,106,.05)}.home-btn:hover{background:#f8faff}
    .tabs{display:flex;gap:8px;padding:10px;border:1px solid var(--border);border-radius:18px;background:#fff;margin-bottom:14px}.tab{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:transparent;color:#738095;font-weight:850}.tab.active{color:#fff;background:linear-gradient(135deg,#4aa2c8,#7164c8)}
    .page{display:none}.page.active{display:block}.card{padding:20px;border:1px solid var(--border);border-radius:22px;background:#fff;box-shadow:0 12px 34px rgba(59,78,106,.06)}.section-title{font-size:21px;font-weight:900}.section-sub{margin-top:4px;color:var(--muted);font-size:12px}
    .search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:16px}.input{height:48px;padding:0 15px;border:1px solid #dbe3ec;border-radius:13px;outline:none}.input:focus,.team-search:focus{border-color:#8dcfe9;box-shadow:0 0 0 3px rgba(141,207,233,.16)}.btn{min-height:48px;padding:0 20px;border:0;border-radius:13px;color:#fff;font-weight:850;background:linear-gradient(135deg,#4aa2c8,#7164c8)}.soft{min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:#f7f9fc;color:#637083;font-size:11px;font-weight:800}
    .result{margin-top:18px}.emp-head{padding:18px;border-radius:18px;background:linear-gradient(135deg,#eaf8ff,#fff,#f0ebff)}.emp-row,.round-row,.team-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.emp-name{font-size:24px;font-weight:900}.emp-meta,.round-text{color:#718096;font-size:11px}.round-row{margin-top:14px}.round-actions,.chips{display:flex;gap:6px;flex-wrap:wrap}
    .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}.weekday{text-align:center;color:#7b8798;font-size:10px;font-weight:850}.day{min-height:105px;padding:10px;border:1px solid var(--border);border-radius:13px;background:#fff}.day.today{border:2px solid #75b7d2;box-shadow:0 0 0 3px rgba(117,183,210,.12)}.day-date{font-size:11px;font-weight:900}.day-name{font-size:8px;color:#98a2b3}.today-tag{display:inline-block;margin-top:5px;padding:2px 6px;border-radius:99px;background:#344054;color:#fff;font-size:7px;font-weight:900}
    .shift{display:inline-flex;align-items:center;justify-content:center;min-width:58px;padding:6px 9px;border:1px solid;border-radius:10px;font-size:10px;font-weight:850;white-space:nowrap}.sm{color:var(--yt);background:var(--yellow);border-color:var(--yb)}.sn{color:var(--pt);background:var(--purple);border-color:var(--pb)}.so{color:var(--rt);background:var(--red);border-color:var(--rb)}.su{color:var(--gt);background:var(--gray);border-color:var(--gb)}
    .team-head{margin-top:15px}.chip{padding:7px 10px;border-radius:99px;font-size:10px;font-weight:900}.a{background:#ffe1e5;color:#c85b68}.b{background:#fff4bf;color:#9a7600}.c{background:#dcf6e7;color:#3f9970}.x{background:#e8f5fc;color:#408fb9}.team-search{width:min(420px,100%);height:42px;padding:0 13px;border:1px solid #dbe3ec;border-radius:12px;outline:none}
    .team-filter-bar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}
    .team-filter{
      min-height:38px;
      padding:0 14px;
      border:2px solid transparent;
      border-radius:99px;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
      transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
    }
    .team-filter:hover{transform:translateY(-1px)}
    .team-filter.active{
      border-color:#667085;
      box-shadow:0 0 0 3px rgba(102,112,133,.10);
      transform:translateY(-1px);
    }
    .team-filter.all{background:#e8f5fc;color:#408fb9}
    .team-filter.fa{background:#ffe1e5;color:#c85b68}
    .team-filter.fb{background:#fff4bf;color:#9a7600}
    .team-filter.fc{background:#dcf6e7;color:#3f9970}
    .wrap{overflow:auto;max-height:calc(100vh - 290px);margin-top:14px;border:1px solid var(--border);border-radius:16px}.table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:10px}.table th,.table td{height:58px;padding:8px 10px;border-right:1px solid #edf1f5;border-bottom:1px solid #edf1f5;text-align:center;background:#fff}.table th{position:sticky;top:0;z-index:4;background:#f7f9fc;color:#667085;font-weight:900}.sticky-emp{position:sticky!important;left:0;z-index:5!important;min-width:190px;max-width:190px;text-align:left!important;background:#fff!important}.sticky-team{position:sticky!important;left:190px;z-index:5!important;min-width:88px;background:#fff!important}th.sticky-emp,th.sticky-team{z-index:8!important;background:#f7f9fc!important}.emp-code{font-weight:900}.emp-name2{color:#348ebc;font-weight:850}.pos{margin-top:3px;color:#98a2b3;font-size:8px}.date-col{min-width:82px}.today-col{background:#f0faff!important}
    .empty{padding:42px 20px;text-align:center;color:#8b96a6}.error{padding:13px 14px;border:1px solid #ffcbd0;border-radius:12px;background:#fff0f2;color:#bd4d58;font-size:12px}.loading{opacity:.55;pointer-events:none}
    @media(max-width:760px){.app{width:calc(100% - 12px);margin-top:8px}.pill{display:none}.tabs{padding:6px;gap:4px}.tab{flex:1;padding:0 6px;font-size:11px}.card{padding:14px}.search{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,minmax(0,1fr))}.weekday{display:none}.team-search{width:100%}.team-filter-bar{gap:5px}.team-filter{flex:1;min-width:70px;padding:0 7px}.sticky-emp{min-width:150px;max-width:150px}.sticky-team{left:150px;min-width:75px}.wrap{max-height:calc(100vh - 310px)}}
    @media(max-width:420px){.calendar{grid-template-columns:1fr}.title{font-size:18px}}
  </style>
  <title>Employee Center · ตารางกะพนักงาน</title>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="brand">
      <div class="logo">👥</div>
      <div>
        <div class="title">ตารางกะพนักงาน</div>
        <div class="sub">Employee Shift</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="home-btn" type="button" onclick="goHome()">← กลับหน้าหลัก</button>
      <div class="pill" id="todayPill"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="openTab('mine',this)">👤 ตารางกะของฉัน</button>
    <button class="tab" onclick="openTab('team',this)">👥 ตารางกะทีม</button>
  </div>

  <section class="page active" id="page-mine">
    <div class="card">
      <div class="section-title">👁️ ตารางกะของฉัน</div>
      <div class="section-sub">ค้นหาได้ด้วยรหัสพนักงานหรือชื่อเล่น</div>
      <div class="search"><input id="employeeQuery" class="input" placeholder="เช่น AD0013 หรือ มิกกี้" onkeydown="if(event.key==='Enter')loadMySchedule()"><button class="btn" onclick="loadMySchedule()">ดูตาราง</button></div>
      <div class="result" id="mineResult"><div class="empty">กรุณากรอกรหัสหรือชื่อพนักงาน</div></div>
    </div>
  </section>

  <section class="page" id="page-team">
    <div class="card">
      <div class="section-title">👥 ตารางกะทีม</div>
      <div class="section-sub">ภาพรวมตารางกะพนักงานทุก TEAM</div>
      <div class="result" id="teamResult"><div class="empty">กดเมนูนี้แล้วระบบจะแสดงทุก TEAM</div></div>
    </div>
  </section>
</div>

<script>
// Standalone frontend for GitHub Pages — reads shift data from Apps Script JSONP API.
const API_URL = 'https://script.google.com/macros/s/AKfycbxxxoVRi0XKiC0pcuUmlyUivPbXvEephl4vbZ-x1afHVfi71ZpOZhNXh89AwNLo8YWv/exec';
const INITIAL_EMPLOYEE_ID =
  new URLSearchParams(window.location.search).get('id') || '';
const STATE={myData:null,myQuery:'',teamData:null,teamFilter:'',teamChoice:'ALL'};

document.addEventListener('DOMContentLoaded',()=>{
  setTodayPill();

  const initial =
    normalizeEmployeeQuery(
      INITIAL_EMPLOYEE_ID
    );

  if(initial){
    document.getElementById('employeeQuery').value = initial;
    loadMySchedule();
  }
});

function openTab(tab,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+tab).classList.add('active');btn.classList.add('active');if(tab==='team'&&!STATE.teamData)loadTeamSchedule();}

function loadMySchedule(anchorDate){
  const input = document.getElementById('employeeQuery');

  const query =
    normalizeEmployeeQuery(
      input.value
    );

  input.value = query;

  if(!query){
    return mineError(
      'กรุณากรอกรหัสหรือชื่อพนักงาน'
    );
  }

  setLoading(true);

  apiJsonp(
    'employeeSchedule',
    {
      query: query,
      anchorDate: anchorDate || ''
    }
  )
  .then(data=>{
    setLoading(false);

    STATE.myData = data;
    STATE.myQuery = data.employee.employeeId;

    input.value =
      data.employee.employeeId;

    renderMine(data);
  })
  .catch(err=>{
    setLoading(false);

    mineError(
      cleanServerError(
        err
      )
    );
  });
}

function renderMine(data){const e=data.employee;const names=['จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์'];let h=`<div class="emp-head"><div class="emp-row"><div><div class="emp-name">${esc(e.nickname)}</div><div class="emp-meta">${esc(e.employeeId)} · ${esc(e.team||'-')} · ${esc(e.position||'-')}</div></div>${badge(data.todayShift)}</div><div class="round-row"><div class="round-text">รอบ ${thaiDate(data.round.from)} - ${thaiDate(data.round.to)}</div><div class="round-actions"><button class="soft" onclick="moveMine(-1)">‹ รอบก่อน</button><button class="soft" onclick="moveMine(0)">รอบปัจจุบัน</button><button class="soft" onclick="moveMine(1)">รอบถัดไป ›</button></div></div></div><div class="calendar">`;
  names.forEach(n=>h+=`<div class="weekday">${n}</div>`);const first=parseDate(data.days[0]?.date);if(first){const i=first.getDay()===0?6:first.getDay()-1;for(let x=0;x<i;x++)h+='<div></div>';}
  data.days.forEach(d=>{const today=d.date===data.today;h+=`<div class="day ${today?'today':''}"><div class="day-date">${shortDate(d.date)}</div><div class="day-name">${weekday(parseDate(d.date))}</div>${today?'<div class="today-tag">วันนี้</div>':''}<div style="margin-top:9px">${badge(d.shift)}</div></div>`;});h+='</div>';document.getElementById('mineResult').innerHTML=h;}

function moveMine(dir){if(!STATE.myData)return;if(dir===0)return loadMySchedule(STATE.myData.today);const ref=dir<0?STATE.myData.round.from:STATE.myData.round.to;const d=parseDate(ref);d.setDate(d.getDate()+(dir<0?-1:1));loadMySchedule(dateInput(d));}

function loadTeamSchedule(anchorDate){
  setLoading(true);

  apiJsonp(
    'teamSchedule',
    {
      anchorDate: anchorDate || ''
    }
  )
  .then(data=>{
    setLoading(false);
    STATE.teamData = data;
    renderTeam();
  })
  .catch(err=>{
    setLoading(false);
    document.getElementById('teamResult').innerHTML =
      `<div class="error">${esc(cleanServerError(err))}</div>`;
  });
}

function setTeamChoice(team){
  if(
    team !== 'ALL' &&
    STATE.teamChoice === team
  ){
    STATE.teamChoice = 'ALL';
  }else{
    STATE.teamChoice = team;
  }

  renderTeam();
}

function renderTeam(){
  const data = STATE.teamData;
  if(!data)return;

  const q =
    String(
      STATE.teamFilter || ''
    )
    .trim()
    .toLowerCase();

  let rows = data.rows;

  if(
    STATE.teamChoice &&
    STATE.teamChoice !== 'ALL'
  ){
    rows = rows.filter(
      r =>
        String(
          r.team || ''
        )
        .trim()
        .toUpperCase() ===
        STATE.teamChoice
    );
  }

  if(q){
    rows = rows.filter(
      r =>
        [
          r.employeeId,
          r.nickname,
          r.team,
          r.position
        ]
        .join(' ')
        .toLowerCase()
        .includes(q)
    );
  }

  const countA = data.counts?.['TEAM A'] || 0;
  const countB = data.counts?.['TEAM B'] || 0;
  const countC = data.counts?.['TEAM C'] || 0;

  const filters = `
    <div class="team-filter-bar">

      <button
        type="button"
        class="team-filter all ${STATE.teamChoice==='ALL'?'active':''}"
        onclick="setTeamChoice('ALL')"
        title="แสดงพนักงานทุกทีม"
      >
        ทั้งหมด · ${data.rows.length} คน
      </button>

      <button
        type="button"
        class="team-filter fa ${STATE.teamChoice==='TEAM A'?'active':''}"
        onclick="setTeamChoice('TEAM A')"
        title="กรองเฉพาะ TEAM A"
      >
        TEAM A · ${countA} คน
      </button>

      <button
        type="button"
        class="team-filter fb ${STATE.teamChoice==='TEAM B'?'active':''}"
        onclick="setTeamChoice('TEAM B')"
        title="กรองเฉพาะ TEAM B"
      >
        TEAM B · ${countB} คน
      </button>

      <button
        type="button"
        class="team-filter fc ${STATE.teamChoice==='TEAM C'?'active':''}"
        onclick="setTeamChoice('TEAM C')"
        title="กรองเฉพาะ TEAM C"
      >
        TEAM C · ${countC} คน
      </button>

    </div>
  `;

  let h=`
    <div class="round-row">
      <div class="round-text">
        รอบ ${thaiDate(data.round.from)}
        - ${thaiDate(data.round.to)}
        · แสดง ${rows.length} จาก ${data.rows.length} คน
      </div>
      <div class="round-actions">
        <button class="soft" onclick="moveTeam(-1)">‹ รอบก่อน</button>
        <button class="soft" onclick="moveTeam(0)">รอบปัจจุบัน</button>
        <button class="soft" onclick="moveTeam(1)">รอบถัดไป ›</button>
      </div>
    </div>

    ${filters}

    <div class="team-head">
      <div></div>
      <input
        class="team-search"
        placeholder="🔎 ค้นหารหัส / ชื่อ / TEAM / ตำแหน่ง"
        value="${attr(STATE.teamFilter)}"
        oninput="STATE.teamFilter=this.value;renderTeam()"
      >
    </div>
  `;

  if(!rows.length){
    document.getElementById('teamResult').innerHTML =
      h +
      '<div class="empty">ไม่พบข้อมูลที่ค้นหา</div>';
    return;
  }

  h += '<div class="wrap"><table class="table"><thead><tr><th class="sticky-emp">รหัส · ชื่อ</th><th class="sticky-team">TEAM</th>';

  data.dates.forEach(
    d =>
      h += `
        <th class="date-col ${d===data.today?'today-col':''}">
          ${shortDate(d)}
          <div style="font-size:8px;color:#98a2b3">
            ${weekday(parseDate(d))}
          </div>
        </th>
      `
  );

  h += '</tr></thead><tbody>';

  rows.forEach(r=>{
    h += `
      <tr>
        <td class="sticky-emp">
          <span class="emp-code">${esc(r.employeeId)}</span>
          ·
          <span class="emp-name2">${esc(r.nickname)}</span>
          <div class="pos">${esc(r.position||'')}</div>
        </td>
        <td class="sticky-team">
          <span class="chip ${teamClass(r.team)}">
            ${esc(r.team||'-')}
          </span>
        </td>
    `;

    r.days.forEach(
      d =>
        h += `
          <td class="${d.date===data.today?'today-col':''}">
            ${badge(d.shift)}
          </td>
        `
    );

    h += '</tr>';
  });

  h += '</tbody></table></div>';

  document.getElementById('teamResult').innerHTML = h;
}

function moveTeam(dir){if(!STATE.teamData)return;if(dir===0)return loadTeamSchedule(STATE.teamData.today);const ref=dir<0?STATE.teamData.round.from:STATE.teamData.round.to;const d=parseDate(ref);d.setDate(d.getDate()+(dir<0?-1:1));loadTeamSchedule(dateInput(d));}


function apiJsonp(action, params){
  return new Promise((resolve,reject)=>{
    const callback =
      '__employeeShiftCallback_' +
      Date.now() +
      '_' +
      Math.random().toString(36).slice(2);

    const script =
      document.createElement('script');

    const url =
      new URL(API_URL);

    url.searchParams.set(
      'api',
      'public'
    );

    url.searchParams.set(
      'action',
      action
    );

    url.searchParams.set(
      'callback',
      callback
    );

    Object.entries(
      params || {}
    ).forEach(([key,value])=>{
      if(
        value !== undefined &&
        value !== null &&
        String(value) !== ''
      ){
        url.searchParams.set(
          key,
          String(value)
        );
      }
    });

    let finished = false;

    const cleanup = ()=>{
      if(finished)return;
      finished = true;

      try{
        delete window[callback];
      }catch(_){
        window[callback] = undefined;
      }

      script.remove();
    };

    const timer =
      setTimeout(()=>{
        cleanup();
        reject(
          new Error(
            'เชื่อมต่อระบบตารางกะไม่สำเร็จ กรุณาลองใหม่'
          )
        );
      },20000);

    window[callback] = payload=>{
      clearTimeout(timer);
      cleanup();

      if(
        payload &&
        payload.ok
      ){
        resolve(
          payload.data
        );
        return;
      }

      reject(
        new Error(
          payload?.error ||
          'เกิดข้อผิดพลาดจากระบบ'
        )
      );
    };

    script.onerror = ()=>{
      clearTimeout(timer);
      cleanup();

      reject(
        new Error(
          'ไม่สามารถเชื่อมต่อระบบตารางกะได้'
        )
      );
    };

    script.src =
      url.toString();

    document.head.appendChild(
      script
    );
  });
}

function badge(s){if(s==='MORNING')return '<span class="shift sm">☀️ เช้า</span>';if(s==='NIGHT')return '<span class="shift sn">🌙 ดึก</span>';if(s==='OFF')return '<span class="shift so">หยุด</span>';return '<span class="shift su">🚫 ไม่มีกะ</span>';}
function teamClass(t){t=String(t||'').trim().toUpperCase();return t==='TEAM A'?'a':t==='TEAM B'?'b':t==='TEAM C'?'c':'x';}
function normalizeEmployeeQuery(value){
  let text =
    String(value ?? '')
      .trim();

  /*
   * ป้องกันค่าว่างจาก template เก่า
   * ที่เคยแสดงเป็น "" หรือ ''
   */
  if(
    text === '""' ||
    text === "''"
  ){
    return '';
  }

  text =
    text.replace(
      /^["']+|["']+$/g,
      ''
    ).trim();

  return text;
}

function cleanServerError(err){
  let message =
    String(
      err?.message ||
      err ||
      'เกิดข้อผิดพลาด'
    ).trim();

  message =
    message.replace(
      /^Error:\s*/i,
      ''
    );

  return message;
}

function mineError(m){
  document.getElementById('mineResult').innerHTML =
    `<div class="error">⚠️ ${esc(m)}</div>`;
}
function goHome(){window.location.href='./index.html';}
function setLoading(v){document.getElementById('app').classList.toggle('loading',!!v);}
function setTodayPill(){document.getElementById('todayPill').textContent='📅 '+new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});}
function parseDate(t){if(!t)return null;const p=String(t).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12);}
function dateInput(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function thaiDate(t){const d=parseDate(t);return d?d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):'-';}
function shortDate(t){const d=parseDate(t);return d?d.getDate()+'/'+(d.getMonth()+1):'-';}
function weekday(d){return d?['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'][d.getDay()]:'';}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function attr(v){return esc(v);}
</script>
